app = "ffb-worker"
primary_region = "mad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
MAIL_MODE = "resend"

[processes]
worker = "bun apps/worker/src/index.ts"

[[vm]]
processes = ["worker"]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
