app = "ffb-api"
primary_region = "mad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
API_HOST = "0.0.0.0"
API_PORT = "8080"
MAIL_MODE = "resend"

[deploy]
release_command = "bun packages/database/src/migrate.ts"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
[http_service.concurrency]
type = "connections"
soft_limit = 200
hard_limit = 250
[[http_service.checks]]
interval = "30s"
timeout = "5s"
grace_period = "10s"
method = "GET"
path = "/health/ready"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
